<style>
:root{
  --bg:#e8e9e5; --panel:#dedfd9; --mat:#f6f6f3; --fg:#171b1c; --muted:#5d6663;
  --line:#c6c8c1; --keyline:#b9bcb4; --accent:#7a6410;
  --shadow:0 1px 1px rgba(20,25,25,.07),0 12px 26px -14px rgba(20,25,25,.34);
  --maxw:1180px;
  --s1:6px; --s2:12px; --s3:20px; --s4:32px; --s5:48px; --s6:72px; --s7:112px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101314; --panel:#171b1c; --mat:#1b2021; --fg:#e2e6e4; --muted:#8a938f;
    --line:#272d2e; --keyline:#333a3b; --accent:#e3c14a;
    --shadow:0 1px 1px rgba(0,0,0,.55),0 16px 34px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101314; --panel:#171b1c; --mat:#1b2021; --fg:#e2e6e4; --muted:#8a938f;
  --line:#272d2e; --keyline:#333a3b; --accent:#e3c14a;
  --shadow:0 1px 1px rgba(0,0,0,.55),0 16px 34px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin-inline:auto; padding:0 var(--s4)}

/* ---------- mounted print ---------- */
.mount{
  background:var(--mat);
  /* museum mat: generous, and weighted at the foot so the image does not read low */
  padding:clamp(18px,2.3vw,34px);
  padding-bottom:clamp(26px,3.2vw,48px);
  border:1px solid var(--line);
  border-radius:0;
  box-shadow:var(--shadow);
}
.mount .data{
  margin:12px 1px 0; color:var(--muted);
  justify-content:flex-start;
}
.mount img{
  display:block; width:100%; height:auto;
  border:1px solid var(--keyline);
  border-radius:0;
}

/* ---------- masthead ---------- */
.masthead{padding:var(--s7) 0 0}
.kicker{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.20em; text-transform:uppercase; color:var(--accent);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.kicker::after{content:""; flex:1; height:1px; background:var(--line); min-width:40px}
h1{
  font-family:"Newsreader",Georgia,serif; font-weight:500;
  font-size:clamp(2.9rem,7.5vw,5.1rem); line-height:.98; letter-spacing:-.018em;
  margin:20px 0 0; text-wrap:balance;
}
h1 em{font-style:italic; color:var(--muted)}
.byline{
  margin:var(--s4) 0 0; display:flex; gap:var(--s2) var(--s4); flex-wrap:wrap;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  letter-spacing:.03em; color:var(--muted);
}
.byline b{color:var(--fg); font-weight:600}

/* ---------- plates ---------- */
.hero{margin-top:var(--s6)}
.plates{margin-block:0; padding-block:0; list-style:none}
.plate{
  margin-top:var(--s7); border-top:1px solid var(--line); padding-top:var(--s6);
}
figure{margin:0}
figcaption{margin:0}

.label{
  margin:var(--s4) 0 0;
}
.names{min-width:0}
.hu{
  font-family:"Newsreader",Georgia,serif; font-weight:500;
  font-size:clamp(1.55rem,3.2vw,2.15rem); line-height:1.1; margin:0;
  letter-spacing:-.012em; text-wrap:balance;
}
.en{margin:var(--s2) 0 0; color:var(--muted); font-size:.98rem; line-height:1.4}
.la{
  font-family:"Newsreader",Georgia,serif; font-style:italic;
  color:var(--muted); font-size:1.02rem; margin:2px 0 0; line-height:1.4;
}
.data{
  margin:0; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px; letter-spacing:.02em; color:var(--muted);
  font-variant-numeric:tabular-nums; display:flex; gap:var(--s1) var(--s3);
  flex-wrap:wrap; align-items:baseline;
}
.data span{white-space:nowrap}
.data .sep{color:var(--keyline)}

footer a{
  color:inherit; text-decoration:none;
  border-bottom:1px solid var(--keyline);
}
footer a:hover, footer a:focus-visible{color:var(--accent); border-bottom-color:currentColor}
footer{
  margin-top:var(--s6); padding:var(--s5) 0 var(--s7); color:var(--muted);
  font-size:12px; font-family:"IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.04em; border-top:1px solid var(--line);
}

@media (max-width:820px){
  .label{grid-template-columns:1fr; gap:var(--s4)}
}
@media (max-width:600px){
  :root{--s5:32px; --s6:40px; --s7:44px}
  /* give the photograph the screen: thinner gutter and a thinner mat */
  .wrap{padding:0 14px}
  .mount{padding:10px 10px 14px}
  /* the clamp floor was larger than 7.5vw at phone widths, so the title
     rendered at its maximum instead of scaling down */
  h1{font-size:clamp(2rem,9vw,3rem)}
  .hu{font-size:clamp(1.35rem,6vw,1.7rem)}
  .data{font-size:12px}
  .byline{gap:var(--s1) var(--s3)}
  /* 17px of text is not a tap target */
  footer a{display:inline-block; padding:10px 4px; margin:-10px 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

  position:fixed; inset:0; z-index:100; background:rgba(8,10,11,.95);
  display:flex; align-items:center; justify-content:center; padding:2vmin;
  cursor:zoom-out;
}
.lightbox-inner{max-width:100%; max-height:100%; display:flex}
.lightbox .mount{
  margin:0; max-width:96vw;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.lightbox .mount img{
  width:auto; max-width:100%;
  max-height:calc(100vh - 12vmin - 3.4rem);
  height:auto; object-fit:contain;
}
</style>
<script>
(function(){
  var ov=document.createElement("div");
  ov.className="lightbox"; ov.hidden=true;
  ov.setAttribute("role","dialog");
  ov.setAttribute("aria-modal","true");
  ov.setAttribute("aria-label","Nagyított kép");
  ov.innerHTML='<button type="button" class="lightbox-close" aria-label="Bezárás">\u00d7</button>'
             + '<div class="lightbox-inner"></div>';
  document.body.appendChild(ov);
  var inner=ov.querySelector(".lightbox-inner");
  var closeBtn=ov.querySelector(".lightbox-close");
  var opener=null;
  function open(mount, trigger){
    inner.innerHTML="";
    var clone=mount.cloneNode(true);
    clone.removeAttribute("style");          // the inline max-width is for the page, not the overlay
    var img=clone.querySelector("img");
    if(img){ img.removeAttribute("tabindex"); img.removeAttribute("role"); }
    inner.appendChild(clone);
    opener=trigger||null;
    ov.hidden=false; document.documentElement.style.overflow="hidden";
    closeBtn.focus();                        // move focus into the dialog
  }
  function close(){
    ov.hidden=true; inner.innerHTML="";
    document.documentElement.style.overflow="";
    if(opener){ opener.focus(); opener=null; } // and hand it back where it came from
  }
  document.querySelectorAll(".mount img").forEach(function(img){
    img.addEventListener("click", function(){ open(img.closest(".mount"), img); });
    img.addEventListener("keydown", function(e){
      if(e.key==="Enter" || e.key===" " || e.key==="Spacebar"){
        e.preventDefault(); open(img.closest(".mount"), img);
      }
    });
  });
  ov.addEventListener("click", close);
  closeBtn.addEventListener("click", function(e){ e.stopPropagation(); close(); });
  document.addEventListener("keydown", function(e){
    if(ov.hidden) return;
    if(e.key==="Escape"){ close(); return; }
    // the dialog holds one control, so trapping is simply: keep focus on it
    if(e.key==="Tab"){ e.preventDefault(); closeBtn.focus(); }
  });
})();
</script>
</body>
</html>
