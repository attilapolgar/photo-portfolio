<body>
<style>
:root{
  --bg:#e8e9e5; --panel:#dedfd9; --mat:#f6f6f3; --fg:#171b1c; --muted:#5d6663;
  --line:#c6c8c1; --keyline:#b9bcb4; --accent:#7a6410;
  --shadow:0 1px 1px rgba(20,25,25,.07),0 12px 26px -14px rgba(20,25,25,.34);
  --maxw:1180px;
  --s1:6px; --s2:12px; --s3:20px; --s4:32px; --s5:48px; --s6:72px; --s7:112px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101314; --panel:#171b1c; --mat:#1b2021; --fg:#e2e6e4; --muted:#8a938f;
    --line:#272d2e; --keyline:#333a3b; --accent:#e3c14a;
    --shadow:0 1px 1px rgba(0,0,0,.55),0 16px 34px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101314; --panel:#171b1c; --mat:#1b2021; --fg:#e2e6e4; --muted:#8a938f;
  --line:#272d2e; --keyline:#333a3b; --accent:#e3c14a;
  --shadow:0 1px 1px rgba(0,0,0,.55),0 16px 34px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin-inline:auto; padding:0 var(--s4)}

/* ---------- mounted print ---------- */
.cover{max-width:none !important}
.cover-head{margin:0 0 clamp(14px,1.8vw,24px)}
.cover-head h1{
  font-size:clamp(1.9rem,4.4vw,3.1rem); margin:0;
}
.cover-head .byline{margin-top:10px; padding:0; background:none; box-shadow:none}
.hero{margin-top:clamp(20px,3vw,40px)}
.mount{
  background:var(--mat);
  /* museum mat: generous, and weighted at the foot so the image does not read low */
  padding:clamp(18px,2.3vw,34px);
  /* the label sits in the foot now, so it supplies the visual weight itself */
  padding-bottom:clamp(16px,2.1vw,30px);
  border:1px solid var(--line);
  border-radius:0;
  box-shadow:var(--shadow);
}
.mount .data{
  margin:12px 1px 0; color:var(--muted);
  justify-content:flex-start;
}
.mount img{
  display:block; width:100%; height:auto;
  border:1px solid var(--keyline);
  border-radius:0;
}

/* ---------- masthead ---------- */
.masthead{padding:var(--s7) 0 0}
.kicker{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.20em; text-transform:uppercase; color:var(--accent);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.kicker::after{content:""; flex:1; height:1px; background:var(--line); min-width:40px}
h1{
  font-family:"Newsreader",Georgia,serif; font-weight:500;
  font-size:clamp(2.9rem,7.5vw,5.1rem); line-height:.98; letter-spacing:-.018em;
  margin:20px 0 0; text-wrap:balance;
}
h1 em{font-style:italic; color:var(--muted)}
.byline{
  margin:var(--s4) 0 0; display:flex; gap:var(--s2) var(--s4); flex-wrap:wrap;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  letter-spacing:.03em; color:var(--muted);
}
.byline b{color:var(--fg); font-weight:600}
.ig{
  display:inline-flex; align-items:center; gap:6px;
  color:inherit; text-decoration:none;
  border-bottom:1px solid transparent;
}
.ig:hover, .ig:focus-visible{color:var(--accent); border-bottom-color:currentColor}
.ig-mark{width:1.05em; height:1.05em; fill:currentColor; flex:none}
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  opacity:0; transform:translateY(-100%);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.topbar.on{opacity:1; transform:none; pointer-events:auto}
.topbar .inner{
  max-width:var(--maxw); margin-inline:auto; padding:10px var(--s4);
  display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  letter-spacing:.03em; color:var(--muted);
}
.topbar b{color:var(--fg); font-weight:600}
.tb-id{display:flex; align-items:center; gap:var(--s3); min-width:0}
.tb-id .lang{padding:1px 6px; font-size:11px}
.tb-title{
  font-family:"Newsreader",Georgia,serif; font-size:15px; font-weight:500;
  color:var(--fg); letter-spacing:0;
}
@media (max-width:600px){
  .tb-title{font-size:13px; margin-right:6px}
  .tb-id span{display:none}   /* the handle goes first when it is tight */
}
@media (prefers-reduced-motion:reduce){.topbar{transition:none}}
@media (max-width:600px){.topbar .inner{padding:8px 14px}}
.lang{
  font:inherit; color:inherit; background:none; cursor:pointer;
  border:1px solid var(--keyline); border-radius:2px; padding:2px 7px;
  letter-spacing:.06em;
}
.lang:hover, .lang:focus-visible{color:var(--accent); border-color:var(--accent)}

/* ---------- plates ---------- */
.hero{margin-top:var(--s6)}
.plates{margin-block:0; padding-block:0; list-style:none}
.plate{
  margin-top:var(--s7); border-top:1px solid var(--line); padding-top:var(--s6);
}
figure{margin:0}
figcaption{margin:0}
.plate-label{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:var(--s3); margin:12px 1px 0;
}
.plate-label .names{text-align:right; min-width:0}
.plate-label .data{margin:0}


.hu{
  font-family:"Newsreader",Georgia,serif; font-weight:500;
  font-size:clamp(1.05rem,2.1vw,1.4rem); line-height:1.15; margin:0;
  letter-spacing:-.012em; text-wrap:balance;
}

.la{
  font-family:"Newsreader",Georgia,serif; font-style:italic;
  color:var(--muted); font-size:.88rem; margin:1px 0 0; line-height:1.35;
}
.data{
  margin:0; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px; letter-spacing:.02em; color:var(--muted);
  font-variant-numeric:tabular-nums; display:flex; gap:var(--s1) var(--s3);
  flex-wrap:wrap; align-items:baseline;
}
.data span{white-space:nowrap}
.data .sep{color:var(--keyline)}

footer{
  margin-top:var(--s6); padding:var(--s5) 0 var(--s7); color:var(--muted);
  font-size:12px; font-family:"IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.04em; border-top:1px solid var(--line);
}

@media (max-width:820px){
  .label{grid-template-columns:1fr; gap:var(--s4)}
}
@media (max-width:600px){
  :root{--s5:32px; --s6:40px; --s7:44px}
  /* give the photograph the screen: thinner gutter and a thinner mat */
  .wrap{padding:0 14px}
  .mount{padding:10px 10px 12px}
  /* the clamp floor was larger than 7.5vw at phone widths, so the title
     rendered at its maximum instead of scaling down */
  h1{font-size:clamp(2rem,9vw,3rem)}
  .hu{font-size:clamp(1rem,4.4vw,1.25rem)}
  .data{font-size:12px}
  .plate-label{flex-direction:column-reverse; align-items:stretch; gap:6px}
  .plate-label .names{text-align:left}
  .byline{gap:var(--s1) var(--s3)}
  /* 17px of text is not a tap target */
  }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

<style>
.mount{margin-inline:auto}
.mount .data{
  margin:12px 1px 0; color:var(--muted);
  justify-content:flex-start;
}
.mount img{cursor:zoom-in}
.mount img:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.lightbox-close{
  position:fixed; top:max(12px,2vmin); right:max(12px,2vmin); z-index:1;
  width:44px; height:44px; line-height:1; font-size:26px;
  background:rgba(20,24,26,.6); color:#fff;
  border:1px solid rgba(255,255,255,.25); border-radius:2px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.lightbox-close:hover{background:rgba(20,24,26,.9)}
.lightbox-close:focus-visible{outline:2px solid #fff; outline-offset:2px}
.lightbox-count{
  /* paired with the close button, so it never crowds the mat's bottom edge */
  position:fixed; top:max(12px,2vmin); left:max(12px,2vmin); margin:0;
  height:44px; display:flex; align-items:center; pointer-events:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.08em; color:rgba(255,255,255,.45);
  font-variant-numeric:tabular-nums;
}
.lightbox{
  position:fixed; inset:0; z-index:100; background:rgba(8,10,11,.95);
  display:flex; align-items:center; justify-content:center; padding:2vmin;
  overscroll-behavior:contain;
  cursor:zoom-out;
}
.lightbox-inner{max-width:100%; max-height:100%; display:flex}
.lightbox .mount{
  margin:0; max-width:none; width:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
/* With srcset, width:auto resolves to the DENSITY-CORRECTED intrinsic width,
   so max-width can never scale the image up. Drive the height explicitly from
   whichever limit binds first, and let width follow the aspect ratio. */
.lightbox .mount img{
  height:min(calc(96dvh - 7rem), calc((96vw - 4rem) / var(--ar, 1.5)));
  width:auto; max-width:none; max-height:none; object-fit:contain;
}
</style>
<script>
(function(){
  var mounts=[].slice.call(document.querySelectorAll(".mount"));
  if(!mounts.length) return;

  var ov=document.createElement("div");
  ov.className="lightbox"; ov.hidden=true;
  ov.setAttribute("role","dialog");
  ov.setAttribute("aria-modal","true");
  ov.setAttribute("aria-label","Nagyított kép");
  ov.innerHTML='<button type="button" class="lightbox-close" aria-label="Bezárás">\u00d7</button>'
             + '<div class="lightbox-inner"></div>'
             + '<p class="lightbox-count" aria-live="polite"></p>';
  document.body.appendChild(ov);
  var inner=ov.querySelector(".lightbox-inner");
  var closeBtn=ov.querySelector(".lightbox-close");
  var count=ov.querySelector(".lightbox-count");
  var current=-1;

  function render(i){
    current=(i+mounts.length)%mounts.length;      // wrap at both ends
    var clone=mounts[current].cloneNode(true);
    clone.removeAttribute("style");               // the inline max-width is for the page, not the overlay
    var img=clone.querySelector("img");
    if(img){
      img.removeAttribute("tabindex"); img.removeAttribute("role");
      var w=parseFloat(img.getAttribute("width")), h=parseFloat(img.getAttribute("height"));
      if(w>0 && h>0) clone.style.setProperty("--ar", (w/h).toFixed(4));
    }
    inner.innerHTML="";
    inner.appendChild(clone);
    count.textContent=(current+1)+" / "+mounts.length;
  }
  function open(i){
    render(i);
    ov.hidden=false; document.documentElement.style.overflow="hidden";
    closeBtn.focus();                             // move focus into the dialog
  }
  function step(d){ render(current+d); }
  function close(){
    ov.hidden=true; inner.innerHTML="";
    document.documentElement.style.overflow="";
    if(current>-1){
      var back=mounts[current].querySelector("img");
      if(back){ back.scrollIntoView({block:"center"}); back.focus(); }  // land on the plate you ended on
    }
    current=-1;
  }

  mounts.forEach(function(mount,i){
    var img=mount.querySelector("img");
    if(!img) return;
    img.addEventListener("click", function(){ open(i); });
    img.addEventListener("keydown", function(e){
      if(e.key==="Enter" || e.key===" " || e.key==="Spacebar"){ e.preventDefault(); open(i); }
    });
  });

  ov.addEventListener("click", close);
  closeBtn.addEventListener("click", function(e){ e.stopPropagation(); close(); });
  document.addEventListener("keydown", function(e){
    if(ov.hidden) return;
    if(e.key==="Escape"){ close(); return; }
    if(e.key==="ArrowRight"){ e.preventDefault(); step(1); return; }
    if(e.key==="ArrowLeft"){ e.preventDefault(); step(-1); return; }
    if(e.key==="Tab"){ e.preventDefault(); closeBtn.focus(); }  // one control, so the trap is simple
  });

  // the same gesture on touch, since arrow keys are not available there
  var x0=null;
  ov.addEventListener("touchstart", function(e){ x0=e.changedTouches[0].clientX; }, {passive:true});
  ov.addEventListener("touchend", function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50){ step(dx<0?1:-1); }
  }, {passive:true});
})();
</script>
<script>
(function(){
  var HU={title:"Természetfotó portfólió · Polgár Attila",
          desc:"Polgár Attila természetfotó portfóliója.",
          zoom:"Nagyított kép", close:"Bezárás", btn:"EN", aria:"Switch to English"};
  var EN={title:"Nature photography portfolio · Attila Polgár",
          desc:"Nature photography portfolio of Attila Polgár.",
          zoom:"Enlarged photograph", close:"Close", btn:"HU", aria:"Váltás magyarra"};
  var btns=[].slice.call(document.querySelectorAll(".lang"));
  var meta=document.querySelector('meta[name="description"]');
  function apply(lang){
    var en=lang==="en", cfg=en?EN:HU;
    document.documentElement.lang=en?"en":"hu";
    document.querySelectorAll("[data-en]").forEach(function(el){
      if(!el.dataset.hu) el.dataset.hu=el.textContent;      // keep the original once
      el.textContent = en ? el.dataset.en : el.dataset.hu;
    });
    document.querySelectorAll("[data-alt-en]").forEach(function(el){
      if(!el.dataset.altHu) el.dataset.altHu=el.getAttribute("alt");
      el.setAttribute("alt", en ? el.dataset.altEn : el.dataset.altHu);
    });
    document.title=cfg.title;
    if(meta) meta.setAttribute("content",cfg.desc);
    var ov=document.querySelector(".lightbox");
    if(ov){
      ov.setAttribute("aria-label",cfg.zoom);
      var c=ov.querySelector(".lightbox-close");
      if(c) c.setAttribute("aria-label",cfg.close);
    }
    btns.forEach(function(b){ b.textContent=cfg.btn; b.setAttribute("aria-label",cfg.aria); });
    try{ localStorage.setItem("lang",lang); }catch(e){}
  }
  // The page is Hungarian; English is an opt-in. Auto-switching on browser
  // language would contradict the served <title>, description and lang attribute.
  var saved=null;
  try{ saved=localStorage.getItem("lang"); }catch(e){}
  if(saved==="en") apply("en");
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      apply(document.documentElement.lang==="en" ? "hu" : "en");
    });
  });
})();
</script>
<script>
(function(){
  var bar=document.querySelector(".topbar"), head=document.querySelector(".cover-head");
  if(!bar||!head||!("IntersectionObserver" in window)) return;
  // no scroll listener: the observer fires only when the masthead crosses the edge
  // default root: the bar appears once the title has scrolled fully out of view.
  // The old rootMargin trick assumed the watched element started at y=0, which
  // the cover head does not.
  new IntersectionObserver(function(es){
    bar.classList.toggle("on", !es[0].isIntersecting);
    bar.setAttribute("aria-hidden", es[0].isIntersecting ? "true" : "false");
  }).observe(head);
})();
</script>
